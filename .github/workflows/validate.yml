name: validate
on: [push, pull_request]
jobs:
  mermaid:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mermaid: ['10', '11', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save mermaid@${{ matrix.mermaid }} jsdom
      - run: node scripts/check-mermaid.mjs
